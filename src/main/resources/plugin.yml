name: Mai
version: '${project.version}'
main: me.advait.mai.Mai
api-version: '26.2'
authors: [Advait]
description: Creating an AI-powered world in Minecraft.
commands:
permissions:
  mai.obstacle.run:
    description: Run the obstacle-course test harness (/mai test ...)
    default: op
  mai.humanoid.command:
    description: Give humanoids instructions (/h come, follow, mine, ... and chat like "Mai, follow me")
    default: op
