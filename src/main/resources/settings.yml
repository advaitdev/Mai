# Settings file for Mai

# Distance a humanoid has to be for it to be considered "at" its target
HUMANOID_NEAR_TARGET_DISTANCE: 2

# Seconds a humanoid can remain stuck before its pathfinding times out
HUMANOID_PATHFINDING_TIMEOUT: 10

# Movement and pathfinding configuration
movement:
  pathfinding:
    max_iterations: 100000
    parkour_enabled: true
    max_parkour_reach: 4        # max gap in blocks for sprint-jump
    max_fall_height: 20         # max blocks to consider falling
    allow_unsafe_falls: true    # allow falls that cause damage
    mining_enabled: true        # allow the pathfinder to break blocks to make a route
    bridge_enabled: true        # allow the pathfinder to place blocks to bridge/pillar

  # Costs (ticks) for breaking blocks during pathing. The tick cost to break a
  # block is the vanilla formula: hardness * divisor / tool_speed.
  mine:
    correct_tool_divisor: 30    # ticks per hardness with the right tool
    wrong_tool_divisor: 100     # ticks per hardness with the wrong/no tool
    durability_weight: 0.5      # how much tool durability wear adds to break cost
    cost_inf: 1000000.0         # cost for unbreakable/disallowed blocks (never chosen)

  # Costs (ticks) for placing blocks during pathing (bridge/pillar). Scarcity
  # makes plentiful cheap blocks (cobblestone) preferred over valuable/rare ones
  # (diamond): per-place cost = base + value_weight * value(block) / log2(count+2).
  place:
    place_block_cost: 20.0      # base tick cost to place one block
    equip_cost: 1.0             # tick cost to swap the block into hand
    value_weight: 1.0           # scales the material-value/scarcity penalty

  # Costs in ticks (20 ticks = 1 second). Lower = preferred by pathfinder.
  # Sprint-jumping is fastest (7.127 b/s) so it's cheapest per block.
  costs:
    walk_flat: 3.56             # sprint speed: 20 / 5.612 b/s (default to sprint)
    walk_diagonal: 5.04         # sprint diagonal: walk_flat * sqrt(2)
    sprint_multiplier: 0.77     # not used directly, kept for reference
    step_up: 5.56               # sprint + jump penalty
    step_down: 3.56             # sprint off edge
    fall_safe_base: 3.07        # base cost for safe falls
    fall_per_block: 0.5         # additional cost per block fallen
    fall_damage_penalty: 10.0   # cost per heart of damage taken
    sprint_jump_base: 2.81      # 20 / 7.127 b/s (sprint-jump avg speed)
    sprint_jump_per_gap: 2.81   # cost per block of gap
    jump_penalty: 0.8           # hunger cost per jump (sprinting drains hunger)
    hunger_sprint_cost: 0.1     # extra cost per block when sprinting (hunger drain)
    ladder_up: 8.51             # 20 / 2.35 b/s
    ladder_down: 6.67           # 20 / 3.0 b/s
    swim: 9.09                  # 20 / 2.2 b/s
    lava_multiplier: 4.0
    soul_sand_multiplier: 2.0
    ice_multiplier: 0.8
    sneak: 15.38                # 20 / 1.3 b/s

  # Vanilla movement physics constants
  physics:
    walk_acceleration: 0.1
    sprint_factor: 1.3
    sneak_factor: 0.3
    air_acceleration: 0.02
    default_slipperiness: 0.6
    air_drag: 0.91
    vertical_drag: 0.98
    gravity: 0.08
    jump_velocity: 0.42
    sprint_jump_boost: 0.2

  # Waypoint navigation tuning
  navigation:
    waypoint_radius: 0.5
    path_update_interval: 5     # ticks between path recalculations
    stuck_timeout: 200          # ticks before declaring stuck
    near_target_distance: 0.5   # fallback distance check (exact block match is primary)
